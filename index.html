<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="T1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050f24" />
    <meta name="color-scheme" content="dark" />
    <title>T1</title>
  </head>
  <body>
    <div id="root">
      <!--
        Static splash, shown the instant the HTML parses — before any JS
        has downloaded/parsed/executed. React replaces this the moment it
        mounts. This exists specifically to shrink the "flash of the wrong
        thing" window on a cold app-icon launch (the OS/browser can only
        paint whatever's already in the DOM until the framework takes
        over) — matches the app's real background/theme colors, so
        there's no jarring color-swap either.
      -->
      <style>
        @keyframes static-splash-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div style="
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #050f24;
        color: rgba(245, 247, 251, 0.6);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      ">
        <div style="
          width: 56px;
          height: 56px;
          border-radius: 14px;
          background: #050f24;
          border: 1px solid rgba(255, 196, 64, 0.3);
          color: #ffc440;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 22px;
          letter-spacing: 0.5px;
        ">T1</div>
        <div style="
          width: 32px;
          height: 32px;
          border: 3px solid rgba(255, 196, 64, 0.25);
          border-top-color: #ffc440;
          border-radius: 50%;
          animation: static-splash-spin 0.8s linear infinite;
        "></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
